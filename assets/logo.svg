<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Bible Sequence app icon master. Full bleed, no transparency: iOS applies
       its own corner mask. The book mirrors the in-app BookMark logo
       (src/components/icons.tsx). Render: npm run ios:icon -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#efe5d0"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24395c"/>
      <stop offset="1" stop-color="#16233b"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9842f"/>
      <stop offset="0.5" stop-color="#d9b65e"/>
      <stop offset="1" stop-color="#a9842f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- soft shadow -->
  <ellipse cx="512" cy="810" rx="290" ry="28" fill="#16233b" opacity="0.07"/>

  <!-- book -->
  <rect x="192" y="220" width="640" height="572" rx="64" fill="url(#cover)"/>
  <rect x="216" y="244" width="592" height="524" rx="44" fill="none" stroke="#2f4a73" stroke-width="6" opacity="0.7"/>

  <!-- spine -->
  <path d="M512 280 V732" stroke="#c8a24c" stroke-width="20" stroke-linecap="round"/>

  <!-- verse lines, read in sequence -->
  <g stroke="#e3ca7f" stroke-width="32" stroke-linecap="round">
    <path d="M300 372 H436"/>
    <path d="M300 472 H436"/>
    <path d="M300 572 H396"/>
    <path d="M588 372 H724"/>
    <path d="M588 472 H724"/>
    <path d="M588 572 H684"/>
  </g>

  <!-- ribbon bookmark hanging from the spine -->
  <path d="M484 742 H540 V896 L512 868 L484 896 Z" fill="url(#ribbon)"/>
</svg>
